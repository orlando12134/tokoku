<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tokoku — Toko Klontong Perum GKR</title>
<!-- FITUR: PWA — pintasan layar utama berlogo tokoku (manifest, ikon, warna tema). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#166534">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- FITUR: Layar loading awal — tampil SEBELUM JS jalan (hijau #166534,
     logo tokoku, tulisan "Memuat…", tiga titik berputar CSS murni).
     Disembunyikan JS setelah render pertama selesai; ada pengaman 15 detik
     bila JS gagal. Bukan layar hitam. -->
<div id="splash" class="splash">
  <img src="logo.png" alt="Logo tokoku" class="splash-logo" onerror="this.style.display='none'">
  <p class="splash-text">Memuat…</p>
  <div class="splash-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
</div>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.hidden=true;},15000);</script>
<header class="app-header">
  <img src="logo.png" alt="Logo tokoku" class="logo" onerror="this.style.display='none'">
  <p class="header-tagline">Warga Perum GKR saja</p>
  <p id="storeStatus" class="store-status"></p>
</header>

<main id="view" class="view"></main>

<!-- Bilah keranjang melayang (hanya di tab Belanja, diisi warga.js) -->
<div id="cartBar" class="cart-bar" hidden></div>

<nav id="bottomNav" class="bottom-nav" aria-label="Navigasi utama"></nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<!-- Modal umum: dipakai untuk info (mis. alasan penolakan). Klik di luar
     kotak atau tombol Tutup untuk menutup. -->
<div id="modal" class="modal-overlay" hidden onclick="if(event.target===this)closeModal()">
  <div class="modal" role="dialog" aria-modal="true">
    <div id="modalBody"></div>
    <button type="button" class="btn btn-secondary modal-close" onclick="closeModal()">Tutup</button>
  </div>
</div>

<script src="common.js"></script>
<script src="warga.js"></script>
</body>
</html>
