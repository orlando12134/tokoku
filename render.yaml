# Blueprint Render untuk tokoku (dipakai bila deploy lewat Render).
# Cara pakai: hubungkan repo GitHub ini di dashboard Render → New → Web Service
# (atau New → Blueprint bila render.yaml terdeteksi otomatis).
# PENTING (sejak 2026-11-08): data live tinggal di Turso (libSQL, gratis),
# BUKAN di file SQLite Render — deploy/restart tidak lagi menghapus data.
# Set env TURSO_DATABASE_URL + TURSO_AUTH_TOKEN di dashboard Render
# (sudah tersimpan di service live). DB_PATH di bawah hanya fallback lokal
# bila env Turso tidak ada. Lihat README.md bagian "Deploy".
services:
  - type: web
    name: tokoku
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /opt/render/project/src/data/tokoku.db
